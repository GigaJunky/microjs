<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>micro-js remote</title><style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:16px;max-width:520px;margin:auto}h1{font-size:20px;margin:0 0 4px}small{color:#888}.card{background:#1d1d26;border-radius:12px;padding:14px;margin:14px 0}.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row label{width:70px}.row input[type=range]{flex:1}.row span{width:42px;text-align:right}#sw{height:70px;border-radius:10px;border:1px solid #444}button{background:#3a3a55;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px}button.on{background:#7a3cc8}#chat{height:220px;overflow-y:auto;background:#0b0b10;border-radius:8px;padding:8px;font-size:14px}#chat div{margin:3px 0}#chat b{color:#9cf}.me b{color:#fc9!important}input[type=text]{background:#0b0b10;color:#eee;border:1px solid #444;border-radius:8px;padding:9px;font-size:15px}</style></head><body><h1>micro-js remote</h1><small id="bd"></small><div class="card"><div id="sw"></div><div class="row"><label>Red</label><input type="range" id="r" max="255"><span id="rv"></span></div><div class="row"><label>Green</label><input type="range" id="g" max="255"><span id="gv"></span></div><div class="row"><label>Blue</label><input type="range" id="b" max="255"><span id="bv"></span></div><div class="row"><label>Bright</label><input type="range" id="bright" max="100"><span id="brightv"></span></div><div class="row"><label>Speed</label><input type="range" id="speed" max="100"><span id="speedv"></span></div><div class="row"><button id="auto">Auto: off</button><button id="led">LED: on</button></div></div><div class="card"><div class="row"><label>Pitch</label><input type="range" id="pitch" min="200" max="2000" value="880"><span id="pitchv">880</span></div><div class="row"><button id="beep">Beep!</button></div></div><div class="card"><div id="chat"></div><div class="row" style="margin-top:10px"><input type="text" id="name" placeholder="name" style="width:80px" maxlength="16"><input type="text" id="msg" placeholder="message" style="flex:1" maxlength="200"><button id="send">Send</button></div></div><script>var $=function(i){return document.getElementById(i)},since=0,busy=0,st={};$("name").value=localStorage.getItem("name")||"";function show(s){st=s;$("bd").textContent=s.board;["r","g","b","bright","speed"].forEach(function(k){if(document.activeElement!==$(k))$(k).value=s[k];$(k+"v").textContent=s[k]});$("auto").textContent="Auto: "+(s.auto?"cycling":"off");$("auto").className=s.auto?"on":"";$("led").textContent="LED: "+(s.led?"on":"off");$("led").className=s.led?"on":"";var f=0.3+0.7*s.bright/100;$("sw").style.background="rgb("+Math.round(s.r*f)+","+Math.round(s.g*f)+","+Math.round(s.b*f)+")";s.chat.forEach(function(m){var d=document.createElement("div"),b=document.createElement("b");b.textContent=m.name+": ";d.appendChild(b);d.appendChild(document.createTextNode(m.text));if(m.name===$("name").value)d.className="me";$("chat").appendChild(d);since=Math.max(since,m.id)});if(s.chat.length)$("chat").scrollTop=1e9}function api(p){busy++;return fetch(p,arguments[1]).then(function(r){return r.json()}).then(function(s){busy--;show(s)}).catch(function(){busy--})}function poll(){if(!busy)api("/api/state?since="+since)}setInterval(poll,1000);poll();var t=0;["r","g","b","bright","speed"].forEach(function(k){$(k).oninput=function(){$(k+"v").textContent=this.value;clearTimeout(t);var v=this.value;t=setTimeout(function(){api("/api/led?"+k+"="+v)},60)}});$("auto").onclick=function(){api("/api/led?auto="+(st.auto?0:1))};$("led").onclick=function(){api("/api/led?led="+(st.led?0:1))};$("pitch").oninput=function(){$("pitchv").textContent=this.value};$("beep").onclick=function(){fetch("/api/beep?f="+$("pitch").value+"&ms=150")};function send(){var m=$("msg").value.trim();if(!m)return;localStorage.setItem("name",$("name").value);$("msg").value="";api("/api/chat?since="+since+"&name="+encodeURIComponent($("name").value||"web"),{method:"POST",body:m})}$("send").onclick=send;$("msg").onkeydown=function(e){if(e.key==="Enter")send()};</script></body></html>
