; micro-js: JavaScript interpreter for ESP32 display boards.
;
;   pio run -e cyd -t upload        build + flash firmware for a board (see the [env:...] sections)
;   pio run -e cyd -t uploadfs      copy the data/ folder (scripts) to the board's flash
;   pio device monitor              open the JavaScript REPL (115200 baud); port is auto-detected, or add -p COM4
;   tools/build_release.sh          web-flasher images for every board, into release/
;
; Each [env:...] is one board profile: TFT_eSPI display flags plus BOARD_* flags for pins and
; parts (src/board.h lists them all, with the CYD as the default). To add a board, copy the
; closest profile, fill in its pins from the board's documentation, and test on the device.
; Code only one board needs lives in src/boards/<board>/ and lib/, and only that profile builds it.

[platformio]
default_envs = cyd

; every profile: leave out the board-specific sources and libraries (a profile that needs them
; sets these again)
[env]
build_src_filter = +<*> -<boards/>
lib_ignore = ESP32-S3-VGA, SoftUSB, libdvi, PicoPIOUSB
; bump the last number of src/version.h when the code changed (tools/auto-version.js, run by the
; small Python hook tools/auto_version.py - PlatformIO's build hooks have to be Python)
extra_scripts = pre:tools/auto_version.py

[common]
platform = espressif32 @ 6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    bodmer/TJpg_Decoder @ 1.1.0   ; lcd.drawImage: JPEG
    bitbank2/PNGdec @ 1.1.6       ; lcd.drawImage: PNG
    bitbank2/JPEGDEC @ 1.8.4      ; video.play: Motion-JPEG frames (SIMD on the S3)
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Os
    -fexceptions
    -DCORE_DEBUG_LEVEL=0
    -DJS_WIFI=1
    ; TFT_eSPI: configured here instead of in its User_Setup.h
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; ---------------------------------------------------------------------------------------------
; ESP32-2432S028R "Cheap Yellow Display": ILI9341 320x240, resistive XPT2046 touch, RGB LED,
; speaker pin, light sensor, SD card. No PSRAM. (All BOARD_* values are board.h's defaults.)
[env:cyd]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
board_build.filesystem = ${common.board_build.filesystem}
board_build.partitions = partitions/cyd_ota.csv  ; (a firmware over 1.5 MB no longer fits: go back to huge_app.csv)
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
upload_speed = 921600
; The serial port is auto-detected. To pin one (e.g. on Linux, a stable name that survives replugging):
;   upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
;   monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
; or override per command: pio run -e cyd -t upload --upload-port COM4 / pio device monitor -p COM4
build_flags =
    ${common.build_flags}
    -DBOARD_NAME='"CYD (ESP32-2432S028R)"'
    ; a smaller pool of small objects leaves the heap more mid-size blocks: the mp3 decoder needs them
    -DBOARD_POOL_KB=40
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000

; CYD variant with two USB ports ("CYD2USB"): ST7789 panel, otherwise the same.
[env:cyd2usb]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DBOARD_NAME='"CYD2USB (ESP32-2432S028R v3)"'
    -UILI9341_2_DRIVER
    -DST7789_DRIVER=1

; ---------------------------------------------------------------------------------------------
; M5Stack Cardputer ADV: ESP32-S3FN8 (8 MB flash, no PSRAM), ST7789V2 240x135, 56-key keyboard
; (TCA8418), WS2812 LED, SD card, BOOT button. No touch. Pins from M5Stack's M5GFX/M5Unified.
; The speaker sits behind an ES8311 audio codec (I2S): tone() and MP3 playback go through it.
[env:cardputer-adv]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
board_build.filesystem = ${common.board_build.filesystem}
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DBOARD_NAME='"M5Stack Cardputer ADV"'
    ; serial REPL over the S3's own USB
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ---- display: ST7789V2 135x240 (TFT_eSPI applies the 52/40 offsets for this size)
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_INVERSION_ON=1
    -DTFT_MISO=-1
    -DTFT_MOSI=35
    -DTFT_SCLK=36
    -DTFT_CS=37
    -DTFT_DC=34
    -DTFT_RST=33
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DBOARD_BACKLIGHT=38
    -DBOARD_ROTATION=1
    ; ---- input
    -DBOARD_TOUCH=0
    -DBOARD_KEYBOARD=1
    ; ---- parts
    -DBOARD_LED_WS2812=21
    -DBOARD_SPEAKER_PWM=-1
    ; speaker: ES8311 codec (I2C 0x18 on the keyboard bus) + amplifier, over I2S
    -DBOARD_SPEAKER_I2S_BCK=41
    -DBOARD_SPEAKER_I2S_WS=43
    -DBOARD_SPEAKER_I2S_DOUT=42
    -DBOARD_SPEAKER_ES8311=0x18
    -DBOARD_LIGHT_SENSOR=-1
    -DBOARD_BATTERY_ADC=10     ; battery voltage through a 2:1 divider
    -DBOARD_BOOT_BUTTON=0
    -DBOARD_SD_SCK=40
    -DBOARD_SD_MISO=39
    -DBOARD_SD_MOSI=14
    -DBOARD_SD_CS=12
    -DBOARD_SD_SPI_HOST=FSPI
    ; 20 MHz: at the default 4 MHz (about 350 KB/s) a video's frames and its sound starved each other
    -DBOARD_SD_HZ=20000000
    ; a LoRa module on the EXT header shares the SD SPI bus; park its CS (G5) high so the card reads
    -DBOARD_SD_PARK_CS=5

; ESP32-S3 "CYD" 2.8" (LCDWiki ES3C28P): ESP32-S3R8 with 8 MB PSRAM and 16 MB flash, ILI9341V IPS
; panel, FT6336G capacitive touch, ES8311 codec with speaker amplifier and microphone, SD in SDIO
; mode, WS2812 LED. Pins from the LCDWiki manual / github.com/ngttai/esp32_s3_es3c28p.
[env:cyd-s3]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
board_build.filesystem = ${common.board_build.filesystem}
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    ${common.lib_deps}
    h2zero/NimBLE-Arduino @ 1.4.3   ; ble: scanning and HID keyboard/mouse/gamepad (src/ble.h)
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DJS_BLE=1
    -DBOARD_NAME='"ESP32-S3 CYD 2.8in"'
    -DBOARD_HAS_PSRAM
    ; USB-C wired to the S3's own USB: the REPL is on that port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ---- display: ILI9341V IPS on SPI (reset tied to the chip's reset)
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_ON=1
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    ; HSPI: TFT_eSPI 2.5.43 crashes at start-up on the S3's default (FSPI) port
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=16000000
    -DBOARD_BACKLIGHT=45
    ; ---- touch: FT6336G on I2C
    -DBOARD_TOUCH=2
    -DBOARD_TOUCH_SDA=16
    -DBOARD_TOUCH_SCL=15
    -DBOARD_TOUCH_RST=18
    ; ---- parts
    -DBOARD_LED_WS2812=42
    -DBOARD_SPEAKER_PWM=-1
    ; speaker: ES8311 codec (I2C 0x18 on the touch bus) over I2S, amplifier enabled by GPIO 1 low (tested)
    ; (GPIO 8 is the S3's data out; 6 is the microphone's data in - from the board's ESP-IDF BSP)
    -DBOARD_SPEAKER_I2S_MCLK=4
    -DBOARD_SPEAKER_I2S_BCK=5
    -DBOARD_SPEAKER_I2S_WS=7
    -DBOARD_SPEAKER_I2S_DOUT=8
    -DBOARD_SPEAKER_ES8311=0x18
    -DBOARD_SPEAKER_AMP_EN=1
    -DBOARD_SPEAKER_AMP_ON=LOW
    ; full volume: the amplifier is small (a piezo or little speaker on the connector)
    -DBOARD_SPEAKER_I2S_LEVEL=32000
    -DBOARD_SPEAKER_ES8311_VOL=0xFF
    -DBOARD_LIGHT_SENSOR=-1
    -DBOARD_BATTERY_ADC=9     ; battery voltage through a 2:1 divider
    -DBOARD_BOOT_BUTTON=0
    ; SD card in SDIO mode, used 1-bit
    -DBOARD_SD_MMC_CLK=38
    -DBOARD_SD_MMC_CMD=40
    -DBOARD_SD_MMC_D0=39

; ---------------------------------------------------------------------------------------------
; mast4rbug's ESP32-CoCo board (github.com/mast4rbug/ESP32-CoCo): ESP32-S3 with 8 MB PSRAM, VGA
; output, three USB-A ports run by a software USB host (keyboards and gamepads, no hubs), SD card
; (SDIO, 1-bit), PWM sound, red/green front LED. The picture is a 320x240 TFT_eSPI sprite that the
; S3's LCD peripheral sends out as 640x480 VGA (src/boards/coco-vga/vga_screen.h); USB input is
; src/boards/coco-vga/usb_input.cpp. Both libraries in lib/ come from the ESP32-CoCo emulator.
[env:coco-vga]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
board_build.filesystem = ${common.board_build.filesystem}
board_build.arduino.memory_type = dio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_src_filter = +<*> -<boards/> +<boards/coco-vga/>
lib_ignore =
lib_deps =
    ${common.lib_deps}
    ESP32-S3-VGA        ; lib/: bitluni's VGA output, as used by the ESP32-CoCo emulator
    SoftUSB             ; lib/: ESP32-USB-Soft-Host (keyboards and gamepads on the USB ports)
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    ; REPL on the S3's native USB port (USB-Serial-JTAG); the board's COM port works too
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI provides the drawing code, fonts and sprites; there is no panel (pins unused)
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; ---- board
    -DBOARD_NAME='"ESP32-S3 VGA"'
    -DBOARD_SCREEN_HEADER='"boards/coco-vga/vga_screen.h"'
    -DBOARD_SCREEN_CLASS=VgaScreen
    -DBOARD_ROTATION=1
    -DBOARD_BACKLIGHT=-1
    -DBOARD_TOUCH=0
    -DBOARD_KEYBOARD=2
    -DBOARD_LED_WS2812=-1
    -DBOARD_LED_R=-1
    -DBOARD_LED_G=-1
    -DBOARD_LED_B=-1
    ; front LED (red/green, between GPIO 45 and 46): red = power on, as on the ESP32-CoCo
    -DBOARD_LED_BICOLOR_A=45
    -DBOARD_LED_BICOLOR_B=46
    -DBOARD_LED_IDLE=255,0,0
    -DBOARD_SPEAKER_PWM=47
    -DBOARD_LIGHT_SENSOR=-1
    -DBOARD_BOOT_BUTTON=0
    -DBOARD_SD_CS=-1
    -DBOARD_SD_MMC_CLK=39
    -DBOARD_SD_MMC_CMD=38
    -DBOARD_SD_MMC_D0=40

; ---------------------------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-AMOLED-2.06 watch: ESP32-S3R8 (8 MB PSRAM), 32 MB flash, 410x502 AMOLED
; (CO5300 on QSPI - src/boards/amoled-206/amoled_screen.h), FT3168 touch, ES8311 speaker codec,
; QMI8658 accelerometer/gyro, PCF85063 clock, AXP2101 battery charger, microSD (SDIO, 1-bit).
; Pins from Waveshare's examples (github.com/waveshareteam/ESP32-S3-Touch-AMOLED-2.06).
; UNTESTED: written against a watch whose screen had failed (black with Waveshare's own images too);
; everything but the picture answered. Expect fixes once it runs on a working panel.
[env:amoled-206]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
board_build.filesystem = ${common.board_build.filesystem}
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.partitions = large_littlefs_32MB.csv
build_src_filter = +<*> -<boards/> +<boards/amoled-206/>
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DBOARD_NAME='"Waveshare AMOLED 2.06 watch"'
    -DBOARD_HAS_PSRAM
    ; USB-C is the S3's own USB: the REPL is on that port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI provides the drawing code, fonts and sprites; the panel has its own driver
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=410
    -DTFT_HEIGHT=502
    -DBOARD_SCREEN_HEADER='"boards/amoled-206/amoled_screen.h"'
    -DBOARD_SCREEN_CLASS=AmoledScreen
    -DBOARD_ROTATION=0
    -DBOARD_BACKLIGHT=-1
    ; ---- touch: FT3168 on the shared I2C bus (SDA 15, SCL 14), reset GPIO 9
    -DBOARD_TOUCH=2
    -DBOARD_TOUCH_SDA=15
    -DBOARD_TOUCH_SCL=14
    -DBOARD_TOUCH_RST=9
    ; ---- speaker: ES8311 codec (I2C 0x18) over I2S, amplifier on GPIO 46
    -DBOARD_SPEAKER_PWM=-1
    -DBOARD_SPEAKER_I2S_MCLK=16
    -DBOARD_SPEAKER_I2S_BCK=41
    -DBOARD_SPEAKER_I2S_WS=45
    -DBOARD_SPEAKER_I2S_DOUT=40
    -DBOARD_SPEAKER_ES8311=0x18
    -DBOARD_SPEAKER_AMP_EN=46
    -DBOARD_SPEAKER_AMP_ON=HIGH
    ; ---- parts
    -DBOARD_LED_WS2812=-1
    -DBOARD_LED_R=-1
    -DBOARD_LED_G=-1
    -DBOARD_LED_B=-1
    -DBOARD_LIGHT_SENSOR=-1
    -DBOARD_BOOT_BUTTON=0
    -DBOARD_SD_CS=-1
    -DBOARD_SD_MMC_CLK=2
    -DBOARD_SD_MMC_CMD=1
    -DBOARD_SD_MMC_D0=3

; ---------------------------------------------------------------------------------------------
; Waveshare RP2350-PiZero: RP2350B (520 KB RAM, 16 MB flash, no PSRAM, no WiFi/Bluetooth), Pi Zero
; size and header. The picture goes out of its mini HDMI port as 640x480 DVI (320x240 pixels,
; doubled) made by the PIO with Luke Wren's libdvi (lib/libdvi) - src/boards/rp2350-pizero/
; dvi_screen.h. USB keyboards and gamepads go in the PIO-USB port (USB-C, GPIO 28/29; a hub for
; more than one), src/boards/rp2350-pizero/usb_host.cpp; the other USB-C port is power and the
; REPL. Sound: PWM on GPIO 18 (header pin 12, as on a Raspberry Pi) - an amplifier or headphones
; through a resistor and capacitor. microSD on SPI (SCK 30, MOSI 31, MISO 40, CS 43).
[env:rp2350-pizero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = waveshare_rp2350_pizero
framework = arduino
board_build.core = earlephilhower
; the TMDS bit clock: 640x480 at 60 Hz needs 252 MHz (also a multiple of 12 MHz for PIO-USB)
board_build.f_cpu = 252000000L
board_build.filesystem = littlefs
board_build.filesystem_size = 8m
monitor_speed = 115200
build_src_filter = +<*> -<boards/> +<boards/rp2350-pizero/>
; JPEGDEC asks for its author's LCD library, which isn't needed
lib_ignore = ESP32-S3-VGA, SoftUSB, bb_spi_lcd
lib_deps =
    ${common.lib_deps}
    libdvi              ; lib/: DVI output (BSD-3-Clause, Luke Wren)
    PicoPIOUSB          ; lib/: software USB host (Pico-PIO-USB 0.7.2, MIT)
build_unflags = ${common.build_unflags} -Os
build_flags =
    -std=gnu++17
    -O2
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
    ; the toolchain's C library is newlib-nano: printf only formats floats with this (numbers in
    ; JavaScript are printed with %.0f / %e)
    -Wl,-u,_printf_float
    -fexceptions
    -DJS_WIFI=0
    ; TFT_eSPI provides the drawing code, fonts and sprites; there is no panel (pins unused)
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=-1
    -DTFT_SCLK=-1
    -DTFT_CS=-1
    -DTFT_DC=-1
    -DTFT_RST=-1
    ; libdvi: TMDS on GPIO 32-39 (PIO 0 with its GPIO window moved up by 16), 320x240 doubled
    -DPICO_PIO_USE_GPIO_BASE=1
    -DDVI_VERTICAL_REPEAT=2
    -DDVI_SYMBOLS_PER_WORD=2
    ; USB: Adafruit TinyUSB - the REPL on the native port, and a host on the PIO-USB port (PIO 1;
    ; the core turns the host on when it finds the Pico-PIO-USB library)
    -DUSE_TINYUSB
    ; ---- board
    -DMICROJS_BOARD_NAME='"Waveshare RP2350-PiZero"'
    -DBOARD_SCREEN_HEADER='"boards/rp2350-pizero/dvi_screen.h"'
    -DBOARD_SCREEN_CLASS=DviScreen
    -DBOARD_ROTATION=1
    -DBOARD_BACKLIGHT=-1
    -DBOARD_TOUCH=0
    -DBOARD_KEYBOARD=2
    -DBOARD_LED_WS2812=-1
    -DBOARD_LED_R=-1
    -DBOARD_LED_G=-1
    -DBOARD_LED_B=-1
    -DBOARD_SPEAKER_PWM=18
    -DBOARD_LIGHT_SENSOR=-1
    -DBOARD_BOOT_BUTTON=-1
    -DBOARD_SD_CS=43
    -DBOARD_SD_SCK=30
    -DBOARD_SD_MOSI=31
    -DBOARD_SD_MISO=40
    ; 520 KB of RAM: more for scripts than the ESP32 boards without PSRAM get
    -DBOARD_POOL_KB=64
    -DBOARD_ARENA_KB=48
    -DBOARD_JS_STACK_KB=48

